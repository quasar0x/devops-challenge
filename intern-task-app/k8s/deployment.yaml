apiVersion: apps/v1
kind: Deployment
metadata:
  name: intern-task-app
  labels:
    app: intern-task-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intern-task-app
  template:
    metadata:
      labels:
        app: intern-task-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: intern-task-app:local
          # Image only exists via kind load, there is no registry to pull from
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
